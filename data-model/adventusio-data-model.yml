summary: >-
  Entity graph derived from the live GraphQL schema -- 64 object types, 15 input
  types, 5 enums and 2 custom scalars (JSON, Upload). Relationships below are
  read from typed field references and from explicit id-reference fields; nothing
  is inferred from naming alone unless marked so. Adventus.io publishes no object
  reference, so there is no id-prefix scheme or domain glossary to enrich this with.
identifier_scheme:
  primary: 'Int (auto-increment) on almost every entity'
  exceptions:
  - entity: ConnectInvite
    id_type: 'ID (String)'
  - entity: Application
    field: orderId
    id_type: String
  - entity: OrderSummary
    field: applicationId
    id_type: String
  note: >-
    No prefixed, typed or globally unique identifiers (no obj_xxx style). Integer
    ids are scoped per entity, so an id is only meaningful together with its type.
core_entities:
- name: Student
  role: The central record. Personal details, contact, residence, academic achievement,
    documents, notes, activities and order summary all hang off it.
  key_operations:
    read: [student, students, myStudentProfile]
    write: [addStudent, updateStudent, updateMyStudentProfile, updateStudentAcademicAchievement, updateMyAcademicAchievement]
- name: Institution
  role: Education provider publishing courses and intakes.
  key_operations:
    read: [institution, instituteStats, courseStats]
    write: []
  note: Read-only through this API; institution records are not writable by a caller.
- name: User
  role: Recruiter, agent or institution staff account. Carries a Tenant.
  key_operations:
    read: [user, myAgent, myAccountManagers, myTeamMembers]
- name: Tenant
  role: Multi-tenancy boundary. Every User belongs to one; intake_control_Schedule carries tenantId.
- name: StudentsOrders / Application / OrderSummary
  role: An application a student makes to a course at an institution, and its progress.
  key_operations:
    read: [orders, orderMilestones, studentOrderSummary, myOrderSummary]
- name: Milestone / MilestoneDetails / CurrentMilestone
  role: Application progress stages returned by orderMilestones.
- name: StudentDocument
  role: Uploaded file attached to a student, classified by StudentDocumentType within a StudentDocumentSection and a StudentDocumentCategory.
  key_operations:
    read: [studentDocuments, studentDocumentsV2, myDocuments, myDocumentsV2, studentDocumentTypes, myDocumentTypes]
    write: [uploadStudentDocument, uploadMyDocument, deleteStudentDocument]
- name: ConnectInvite
  role: Adventus Connect -- an institution invites a student. Carries ConnectStudent and ConnectInstitution projections.
  key_operations:
    read: [connectInvites, pendingConnectCount]
    write: [confirmConnectInvite]
- name: intake_control_Schedule
  role: Course intake scheduling. A separately namespaced subsystem with its own pagination and sort inputs.
  key_operations:
    read: [intake_control_listSchedule, intake_control_getStatus, intake_control_getIntakeForCourse]
    write: [intake_control_createSchedule, intake_control_cancelSchedule]
