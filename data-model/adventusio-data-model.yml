observations:
- >-
  There is no Course object type in the schema even though courseId is referenced
  from CourseStats, OrderSummary and intake_control_Schedule. Course records are
  read through the search surface of the web application, not this API.
- >-
  The intake_control_* namespace duplicates pagination, sort, country and error
  types rather than reusing the shared ones. It reads as a separately built
  service exposed through the same gateway.
- >-
  Institution is read-only here; there is no mutation that writes an institution,
  course or intake other than the intake_control scheduling pair.
