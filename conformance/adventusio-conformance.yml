domain_standard:
  market: international education / student recruitment and admissions
  detected: false
  note: >-
    REWARD-ONLY check, and this contract earns nothing on it. The schema
    declares no education-sector interchange standard: there is no OneRoster or
    Ed-Fi shape, no LTI claim, no CASA/CAS application-transfer schema, no
    PESC/EDI or XML transcript vocabulary, no HESA or CommonApp identifier
    scheme, no SCIM URN, and no OAI-PMH verb. Student, course, intake, grading
    system and application are all bespoke Adventus types with integer
    identifiers, so an institution that already speaks a sector standard needs a
    bilateral connector to integrate. Checked against the schema itself, not
    against marketing prose. Recorded as absent rather than invented.
  candidates_checked:
  - PESC (Postsecondary Electronic Standards Council) transcript / application schemas
  - 1EdTech OneRoster
  - 1EdTech LTI
  - Ed-Fi Data Standard
  - SCIM (urn:ietf:params:scim:schemas:*)
  - OAI-PMH
  - CASA / common application transfer schemas
