  conforms: true
  evidence: >-
    https://api.adventus.io/graphql answers a spec-compliant introspection query
    with a full __schema document (99 types) and returns spec-shaped errors[]
    with locations and path. Standard directives include, skip, deprecated and
    specifiedBy are all present.
  method: probed
- id: graphql-over-http
  name: GraphQL over HTTP
  conforms: partial
  evidence: >-
    POST with application/json is supported and returns application/json. GET
    with a query parameter is NOT supported -- GET https://api.adventus.io/graphql
    returns HTTP 400 "GET query missing." Errors are returned with HTTP 200
    rather than the status the origin produced, which is spec-legal but means
    transport status carries no signal.
  method: probed
