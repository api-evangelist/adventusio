aid: adventusio
name: Adventus.io
description: 'Adventus.io operates an international student recruitment marketplace
  that connects education institutions, recruitment agents and students. Recruiters
  manage student records, documents, academic achievements, applications and orders
  through a single platform; institutions publish courses, intakes and admissions
  criteria and receive applications back. The platform is backed by a live GraphQL
  API at api.adventus.io/graphql (47 queries, 30 mutations) which fronts an internal
  REST v2 origin, plus Adventus Drive analytics and Adventus Connect institution
  invitations. There is no public developer portal: the schema is discoverable by
  anonymous introspection but all student, order and institution data requires a
  bearer token issued to a partner account.'
