apis:
- aid: adventusio-graphql
  name: Adventus.io GraphQL API
  position: Producing
  description: 'The GraphQL API behind the Adventus.io recruiter and student
    applications. Exposes 47 queries and 30 mutations across students, student
    documents, academic achievements, notes, activities, messaging threads,
    orders and order milestones, institutions, courses and course statistics,
    study levels, grading systems, countries and languages, notifications,
    Adventus Connect invitations, and the intake_control scheduling surface.
    Authentication is a bearer token obtained from the userLogin (recruiter/staff)
    or studentLogin mutation; reference data (countries, languages, studyLevels,
    gradingSystems) answers anonymously. Introspection is open, so the full
    contract is machine-readable without credentials, but Adventus.io publishes
    no developer portal, no getting-started guide and no rate-limit or
    versioning documentation.'
  image: https://adventus.io/wp-content/uploads/2026/07/adv_favicon.png
